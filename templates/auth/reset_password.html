{% extends "base.html" %}
    {% block title %}Reset Password — Follow Me Boutique{% endblock %}
    {% block content %}
    <div class="min-h-[75vh] flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md bg-[#111622] border border-white/10 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-red-950/40 relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/30 text-xs font-semibold uppercase tracking-wider mb-2">
                <span>🔒</span> Set New Password
            </div>
            <h1 class="display text-3xl sm:text-4xl text-white font-normal">Reset Password</h1>
            <p class="text-xs text-slate-400 mt-2 font-medium leading-relaxed">
                Enter the 6-digit OTP code sent to <span class="text-red-400 font-semibold">{{ email }}</span> and create your new password.
            </p>

            <form method="post" class="mt-8 space-y-4">
                {% csrf_token %}
                <div>
                    <label for="id_otp" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-1.5">
                        Enter 6-Digit OTP
                    </label>
                    <input
                        type="text"
                        name="otp"
                        id="id_otp"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                        placeholder="• • • • • •"
                        class="w-full text-center tracking-[0.5em] text-2xl font-bold border border-white/15 rounded-2xl py-2.5 px-4 bg-[#161c2d] text-white focus:outline-none focus:border-red-500 focus:ring-4 focus:ring-red-500/20 transition-all placeholder:tracking-normal placeholder:font-normal placeholder:text-slate-500"
                        autofocus
                    >
                </div>

                <div>
                    <label class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-1">New Password</label>
                    <input type="password" name="new_password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"
                           class="w-full border border-white/15 rounded-2xl px-4 py-3 text-sm bg-[#161c2d] text-white focus:bg-[#1a2236] focus:outline-none focus:ring-2 focus:ring-red-500/25 focus:border-red-500 transition font-medium">
                </div>

                <div>
                    <label class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-1">Confirm New Password</label>
                    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Repeat new password"
                           class="w-full border border-white/15 rounded-2xl px-4 py-3 text-sm bg-[#161c2d] text-white focus:bg-[#1a2236] focus:outline-none focus:ring-2 focus:ring-red-500/25 focus:border-red-500 transition font-medium">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-500 text-white rounded-2xl py-3.5 font-semibold text-sm shadow-xl shadow-red-600/35 hover:shadow-red-600/50 transition-all transform hover:-translate-y-0.5 mt-2">
                    Save & Update Password 🔑
                </button>
            </form>

            <div class="mt-6 flex items-center justify-between text-xs text-slate-400 border-t border-white/10 pt-5">
                <span>Didn't receive the email?</span>
                <a href="{% url 'resend_reset_password_otp' %}" class="text-red-400 font-semibold hover:underline flex items-center gap-1">
                    <span>🔄</span> Resend OTP
                </a>
            </div>
        </div>
    </div>
    {% endblock %}
