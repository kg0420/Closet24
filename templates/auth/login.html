{% extends "base.html" %}
{% block title %}Login — Closet 24{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-5 py-16 bg-cream">
    <div class="w-full max-w-md bg-white rounded-[2rem] p-8 sm:p-10">
        <p class="uppercase tracking-[.25em] text-xs text-rose">Welcome back</p>
        <h1 class="display text-4xl mt-2">Sign in.</h1>
        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            <div><label class="text-xs uppercase tracking-widest text-gray-500">Username</label><input name="username" required></div>
            <div><label class="text-xs uppercase tracking-widest text-gray-500">Password</label><input type="password" name="password" required></div>
            <style>input{width:100%;margin-top:.5rem;border:1px solid #e5e5e5;border-radius:14px;padding:.85rem 1rem;outline:none}</style>
            <button class="w-full bg-ink text-white rounded-full py-3.5 font-semibold">Sign in</button>
        </form>
        <p class="text-sm text-gray-500 mt-6">New here? <a class="underline" href="{% url 'register' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
