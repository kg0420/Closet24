{% extends "base.html" %}
{% block title %}Sign In — Follow Me Boutique{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md bg-[#111622] border border-white/10 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-red-950/40 relative overflow-hidden">
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-red-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/30 text-xs font-semibold uppercase tracking-wider mb-2">
            <span>✨</span> Welcome Back
        </div>
        <h1 class="display text-3xl sm:text-4xl text-white font-normal">Sign in to boutique</h1>
        <p class="text-xs text-slate-400 mt-1.5 font-medium">Access your personal wardrobe, saved bags & orders.</p>

        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            
            <div>
                <label class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-1">Username</label>
                <input name="username" required autocomplete="username"
                       class="w-full border border-white/15 rounded-2xl px-4 py-3 text-sm bg-[#161c2d] text-white focus:bg-[#1a2236] focus:outline-none focus:ring-2 focus:ring-red-500/25 focus:border-red-500 transition font-medium">
            </div>

            <div>
                <label class="block text-xs font-semibold tracking-wider text-slate-300 uppercase mb-1">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                       class="w-full border border-white/15 rounded-2xl px-4 py-3 text-sm bg-[#161c2d] text-white focus:bg-[#1a2236] focus:outline-none focus:ring-2 focus:ring-red-500/25 focus:border-red-500 transition font-medium">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-500 text-white rounded-2xl py-3.5 font-semibold text-sm shadow-xl shadow-red-600/35 hover:shadow-red-600/50 transition-all transform hover:-translate-y-0.5 mt-2">
                Sign In 🛍️
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/10 text-center text-xs text-slate-400">
            Don't have an account yet? 
            <a class="text-red-400 font-semibold hover:underline ml-1" href="{% url 'register' %}{% if next and next != 'home' %}?next={{ next|urlencode }}{% endif %}">
                Create Account ✨
            </a>
        </div>
    </div>
</div>
{% endblock %}
